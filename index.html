<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Calculadora rápida, sencilla y funcional.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Mi Calculadora</title>
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Calculadora">
      <header class="topbar">
        <div>
          <span class="eyebrow">CALCULADORA</span>
          <h1>Mi Calculadora</h1>
        </div>
        <button id="historyBtn" class="icon-btn" type="button" aria-label="Mostrar historial">↺</button>
      </header>

      <div class="display" aria-live="polite">
        <div id="expression" class="expression"></div>
        <div id="result" class="result">0</div>
      </div>

      <div class="keypad">
        <button class="key utility" data-action="clear" type="button">AC</button>
        <button class="key utility" data-action="delete" type="button">⌫</button>
        <button class="key utility" data-action="percent" type="button">%</button>
        <button class="key operator" data-value="/" type="button">÷</button>

        <button class="key" data-value="7" type="button">7</button>
        <button class="key" data-value="8" type="button">8</button>
        <button class="key" data-value="9" type="button">9</button>
        <button class="key operator" data-value="*" type="button">×</button>

        <button class="key" data-value="4" type="button">4</button>
        <button class="key" data-value="5" type="button">5</button>
        <button class="key" data-value="6" type="button">6</button>
        <button class="key operator" data-value="-" type="button">−</button>

        <button class="key" data-value="1" type="button">1</button>
        <button class="key" data-value="2" type="button">2</button>
        <button class="key" data-value="3" type="button">3</button>
        <button class="key operator" data-value="+" type="button">+</button>

        <button class="key zero" data-value="0" type="button">0</button>
        <button class="key" data-value="." type="button">.</button>
        <button class="key equals" data-action="equals" type="button">=</button>
      </div>
    </section>

    <aside id="historyPanel" class="history-panel" hidden>
      <div class="history-header">
        <h2>Historial</h2>
        <button id="closeHistory" type="button" class="text-btn">Cerrar</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty">Todavía no hay operaciones.</p>
      </div>
      <button id="clearHistory" class="clear-history" type="button">Borrar historial</button>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
